<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="shell">
    <header class="hero">
      <p class="eyebrow">Candidate chat</p>
      <h1>Talk to the candidate</h1>
      <p class="lede">Upload a CV. I study it, then answer as that person — experience, skills, and interview practice.</p>
    </header>

    <section class="upload" aria-label="Upload resume">
      <div class="upload-card">
        <div>
          <strong id="resume-label">No resume uploaded yet</strong>
          <p id="resume-meta">PDF, DOCX, TXT, or MD · max 8MB</p>
        </div>
        <div class="upload-actions">
          <label class="upload-btn">
            Upload resume
            <input id="file" type="file" accept=".pdf,.docx,.txt,.md,application/pdf" hidden />
          </label>
          <button type="button" id="new-chat" class="ghost-btn">New chat</button>
        </div>
      </div>
      <p id="upload-status" class="status" hidden></p>
    </section>

    <section id="suggestions" class="suggestions" aria-label="Suggested prompts">
      <button type="button" data-q="Introduce yourself.">Introduce yourself</button>
      <button type="button" data-q="What are your strongest projects?">Strongest projects</button>
      <button type="button" data-q="Generate interview questions I might get asked.">Interview questions</button>
      <button type="button" data-q="What are your skills?">Skills</button>
    </section>

    <main id="thread" class="thread" aria-live="polite"></main>

    <form id="ask-form" class="composer" autocomplete="off">
      <label class="sr-only" for="question">Your question</label>
      <textarea id="question" rows="2" placeholder="Ask me anything…" required></textarea>
      <button type="submit" id="send">Ask</button>
    </form>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
